name: Build VSIX

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Compile extension (tsc -> out/)
        run: npm run compile

      - name: Install SpritemateX dependencies
        working-directory: spritematex
        run: npm ci

      - name: Build SpritemateX app (vite -> dist/)
        working-directory: spritematex
        run: npm run build

      - name: Copy dist/ to media/spritematex/
        run: |
          rm -rf media/spritematex
          mkdir -p media/spritematex
          cp -R spritematex/dist/* media/spritematex/

      - name: Package VSIX
        run: npx --yes @vscode/vsce@latest package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: spritematex-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
